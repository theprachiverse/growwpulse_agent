# Behaviour config for the Groww Weekly Review Pulse.
# Secrets live in `.env`, never here. Validated by `pulse.config.AppConfig`.

sources:
  play_store:
    enabled: true
    package_id: com.nextbillion.groww
    country: in
    lang: en
    max_reviews: 10000        # increased to 10,000 for deep 8-12 week coverage
    page_size: 200
  app_store:
    enabled: true
    app_id: "1404871703"
    country: in
    max_pages: 10             # Apple RSS limit (~50 reviews/page, ~500 total)
    max_reviews: 500
    accumulate_weekly: true   # build the window from stored weekly snapshots

ingest:
  window_weeks: 10            # allowed: 8..12
  min_reviews: 50             # fewer clean reviews => low-volume banner
  skip_on_low_volume: false   # true = abort instead of banner
  min_words: 8                # keep only reviews with more than 8 words (> 8)
  english_only: true          # keep only English reviews (drop other languages)
  strip_emojis: true          # remove emojis from review text

privacy:
  enable_presidio: false      # true = also scrub person names (install presidio + en_core_web_lg)

ranking:
  source_weighting: volume    # volume | balanced

theming:
  max_themes: 5               # hard cap: <= 5
  top_k: 3
  batch_size: 50              # reviews per classification batch (e.g. 10, 25, 50)
  seed_taxonomy:
    - onboarding
    - kyc
    - payments_upi
    - withdrawals
    - statements
    - app_performance
    - trading_fno
    - customer_support
    - charges

compose:
  max_words: 250              # hard cap: <= 250
  target_words: 220           # shorten down to this so small edits don't breach the cap
  quote_words: [8, 40]

llm:
  model_chat: openai/gpt-oss-120b  # Groq
  model_embed: tfidf-svd  # local scikit-learn TF-IDF + truncated SVD (no key, no torch)
  base_url: https://api.groq.com/openai/v1
  timeout_s: 60
  max_retries: 6
  reasoning_effort: low        # gpt-oss bills its hidden reasoning; low is plenty for classify/compose
  max_completion_tokens: 4000  # hard cap per reply (bounds hidden reasoning + JSON output)
  temperature:
    classify: 0.0
    compose: 0.4
  # Per-review classification (the bulk of tokens) runs on a second Groq model with its own
  # daily quota and ledger (<data_dir>/llm_budget_classify.json). Verify limits for your account at
  # https://console.groq.com/docs/rate-limits and adjust. Set `model: null` to use model_chat.
  classify:
    model: openai/gpt-oss-20b   # must appear in GET https://api.groq.com/openai/v1/models for your key
    daily_token_limit: 200000
    tokens_per_minute: 8000
    safety_margin: 0.9
    max_reviews_per_run: 500    # fresh reviews sent to the LLM per run; others use centroid fallback (0 = no cap)
    max_residual_reviews: 250   # same cap for the residual pass over the 'other' bucket (0 = no cap)
  # Budget below covers only gpt-oss-120b: theme discovery, residual naming, compose (~20-30k/run).
  # Remembered across runs in <data_dir>/llm_budget.json. Groq refills tokens continuously (a rolling
  # 24h bucket, ~8.3k/hour per 200k/day), so the ledger does too: there is no midnight reset.
  budget:
    enabled: true
    max_runs_per_day: 3        # classify model fits ~3 cold runs/day (~55-60k each); cache-warm re-runs are cheap
    daily_token_limit: 200000  # Groq free-tier tokens-per-day for gpt-oss-120b
    safety_margin: 0.9         # plan to use at most 90% of the limit (180k)
    default_run_tokens: 30000  # heavy-model estimate until real runs are recorded (then learned)
    tokens_per_minute: 8000    # Groq free-tier TPM: calls are paced under it instead of hitting 429s
    est_tokens_per_review: 56  # UI estimate: tokens per review classified (prompt + reply)
    est_tokens_per_batch: 1300 # UI estimate: prompt overhead + reasoning per classification call
    est_fixed_tokens: 30000    # UI estimate: theme discovery, residual pass, quotes, actions

publish:
  email_mode: draft          # draft (default, nothing is sent) | send | off
  email_format: html         # html (styled) | text (plain fallback)
  auto_create_doc: true      # create the Doc via MCP on first publish if PULSE_DOC_ID is unset
  doc_title: "Groww Weekly Review Pulse"
