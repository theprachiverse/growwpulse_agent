[project]
name = "groww-review-pulse"
version = "0.1.0"
description = "Weekly AI pulse of Groww app reviews (Play Store + App Store), published to Google Docs and Gmail via MCP."

requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "structlog>=24.1",
    "google-play-scraper>=1.2.7",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "jinja2>=3.1",
    "mcp>=1.2",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# Local embeddings (pulls in torch). Lazily imported, so P0 tooling works without it.
embeddings = ["sentence-transformers>=3.0"]
# Local web UI (pulse serve)
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
pulse = "pulse.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: hits real external services (stores, LLM, MCP); skipped by default",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]
ignore = [
    "E501", # line length handled by ruff formatter
    "RUF001", # ambiguous unicode (we intentionally use — and ★ in user-facing text)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/pulse"]
exclude = [
    "^\\.venv",
    "^data",
]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "google_play_scraper.*",
    "sentence_transformers.*",
    "sklearn.*",
    "langdetect.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
]
ignore_missing_imports = true
